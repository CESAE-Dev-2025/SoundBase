services:
  app:
    container_name: soundbase-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: laravel
        uid: 1000
    image: soundbase-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ..:/var/www
    networks:
      - soundbase

networks:
  soundbase:
    driver: bridge
